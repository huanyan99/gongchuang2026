spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-mysql-test.sql

wechat:
  mock-login: true

weather:
  qweather:
    enabled: ${QWEATHER_ENABLED:false}
    host: ${QWEATHER_HOST:}
    api-key: ${QWEATHER_API_KEY:}

logging:
  level:
    com.example.app: info
