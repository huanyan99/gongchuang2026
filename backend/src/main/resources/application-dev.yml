spring:
  datasource:
    url: jdbc:h2:mem:wechat_app;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/schema-h2.sql

wechat:
  mock-login: true

logging:
  level:
    com.example.app: debug
