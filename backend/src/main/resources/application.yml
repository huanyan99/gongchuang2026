server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/wechat_app?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

wechat:
  appid: your-appid
  secret: your-secret

admin:
  key: change-me-admin-key

logging:
  level:
    com.example.app: debug
